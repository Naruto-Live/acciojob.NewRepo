<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MeShop - Profile</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

    <nav>

        <div class="brand">
            <a href="../shop/index.html">
                MeShop.
            </a>
        </div>

        <div class="nav-items">

            <a href="../shop/index.html">
                Shop
            </a>

            <a href="../cart/index.html">
                My Cart
            </a>

        </div>

    </nav>


    <main class="profile-container">

        <h1>My Profile</h1>


        <div class="profile-card">

            <div class="profile-field">

                <label>
                    First Name
                </label>

                <input
                    type="text"
                    id="first-name"
                    disabled
                >

            </div>


            <div class="profile-field">

                <label>
                    Last Name
                </label>

                <input
                    type="text"
                    id="last-name"
                    disabled
                >

            </div>


            <div class="profile-field">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    disabled
                >

            </div>


            <div class="profile-actions">

                <button id="edit-btn">
                    Edit Profile
                </button>

                <button
                    id="save-btn"
                    style="display: none;"
                >
                    Save Changes
                </button>

                <button id="logout-btn">
                    Logout
                </button>

            </div>


            <p id="message"></p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
