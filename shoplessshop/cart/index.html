<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MeShop - My Cart</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

    <nav>

        <div class="brand">
            <a href="../shop/index.html">
                MeShop.
            </a>
        </div>

        <div class="nav-items">

            <a href="../shop/index.html">
                Shop
            </a>

            <a href="../profile/index.html">
                Profile
            </a>

        </div>

    </nav>


    <main class="cart-container">

        <h1>My Cart</h1>


        <div
            id="cart-items"
            class="cart-items"
        >
        </div>


        <div
            id="empty-cart"
            class="empty-cart"
        >
            Your cart is empty.
        </div>


        <div
            id="cart-summary"
            class="cart-summary"
        >

            <h2>Cart Summary</h2>

            <p>
                Total Items:
                <span id="total-items">0</span>
            </p>

            <p>
                Total:
                $<span id="total-price">0</span>
            </p>

            <button id="checkout-btn">
                Checkout
            </button>

        </div>

    </main>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="script.js"></script>

</body>

</html>
