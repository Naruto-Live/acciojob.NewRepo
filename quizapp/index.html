<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surjeet-QuizApp</title>
    <link rel="shortcut icon" href="img/My LOGO.jpg" type="image/x-icon">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&amp;family=Oswald:wght@200..700&amp;family=Sanchez:ital@0;1&amp;display=swap" rel="stylesheet">
</head>
<body class="container">

    <section class="main">
        <div class="header">
            <div class="logo">
                <img src="img/science (5).jpg" alt="logo">
                <p class="logo-para">
                    LOGO
                </p>
            </div>
        </div>

        <div class="main-content">
            <div class="tag-line">
                Quizopia Your Gateway to Trivia Nirvana!
            </div>
            <div class="randon-btn">
                <button class="randon-btn-btn">RANDON QUIZ <span>➤</span></button>
            </div>
            <img src="img/small2.jpg" alt="" class="small-screen-img" id="small-screen-img">
            <div class="carousal">
                <p class="craousal-para">
                    PLAY, LEARN AND ENJOY!
                </p>
                <div class="main-carousal">
                    <div class="card">
                        <img src="img/history.jpg" alt="gk">
                        <button class="card-btn" data-section="0">INDIAN HISTORY</button>
                    </div>
                    <div class="card">
                        <img src="img/gk.jpg" alt="gk">
                        <button class="card-btn" data-section="1">GENERAL KNOWLEDGE</button>
                    </div>
                    <div class="card">
                        <img src="img/science (1).jpg" alt="gk">
                        <button class="card-btn" data-section="2">SCIENCE</button>
                    </div>
                    <div class="card">
                        <img src="img/maths.jpg" alt="gk">
                        <button class="card-btn" data-section="3">MATHEMATIC</button>
                    </div>
                    <div class="card">
                        <img src="img/geography 2.jpg" alt="gk">
                        <button class="card-btn" data-section="4">INDIAN GEOGRAPHY</button>
                    </div>
                    <div class="card">
                        <img src="img/literature.jpeg" alt="gk">
                        <button class="card-btn" data-section="5">INDIAN LITERATURE</button>
                    </div>
                    <div class="card">
                        <img src="img/world history.jpeg" alt="gk">
                        <button class="card-btn" data-section="6">WORLD HISTORY</button>
                    </div>
                    <div class="card">
                        <img src="img/techonology.jpg" alt="gk">
                        <button class="card-btn" data-section="7">TECHNOLOGY</button>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <div class="question-container">
    </div>

    <script src="script.js"></script>

</body>
</html>
