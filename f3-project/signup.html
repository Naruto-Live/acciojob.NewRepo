<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MeShop - Sign Up</title>
</head>

<body>

    <h1>MeShop.</h1>

    <h2>Sign Up</h2>

    <form id="signup-form">

        <input
            type="text"
            id="first-name"
            placeholder="First Name"
            required
        >

        <input
            type="text"
            id="last-name"
            placeholder="Last Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Sign Up
        </button>

    </form>

    <p id="message"></p>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

    <script src="signup.js"></script>

</body>

</html>
