<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MeShop - Login</title>
</head>

<body>

    <h1>MeShop.</h1>

    <h2>Login</h2>

    <form id="login-form">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

    <p>
        Don't have an account?
        <a href="signup.html">Sign Up</a>
    </p>

    <script src="login.js"></script>

</body>

</html>
